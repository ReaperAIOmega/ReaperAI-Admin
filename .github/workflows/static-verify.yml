name: ReaperAI Admin Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify static application
        run: node scripts/verify-static.mjs
      - name: Verify password recovery behavior
        run: node --test scripts/recovery.test.cjs
      - name: Check letter UI JavaScript syntax
        run: node --check letter-desk.js
      - name: Validate letter workflow integration
        run: node --test scripts/letters.test.mjs
