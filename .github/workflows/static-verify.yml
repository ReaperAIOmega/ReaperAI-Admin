name: ReaperAI Admin Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify static application
        run: node scripts/verify-static.mjs
      - name: Verify password recovery behavior
        run: node --test scripts/recovery.test.cjs
      - name: Verify exact-version reviewer recovery and human approval boundaries
        run: node --test scripts/funding-artifact-review.test.mjs scripts/funding-artifact-review-ui.test.mjs scripts/blueprint-source-rebind.test.mjs scripts/synthetic-retrieval-permit.test.mjs scripts/funding-transaction.test.mjs scripts/funding-operation-recovery.test.mjs scripts/existing-intake.test.mjs scripts/auth-boundary.test.mjs
      - name: Verify funding profile identity and client switching
        run: node --test scripts/funding-profile.test.mjs
      - name: Check letter UI JavaScript syntax
        run: node --check letter-desk.js
      - name: Validate letter workflow integration
        run: node --test scripts/letters.test.mjs
      - name: Verify OMEGA governance module syntax and deterministic gates
        run: |
          node --check omega-letter-governance.mjs
          node --test scripts/omega-letter-governance.test.mjs
