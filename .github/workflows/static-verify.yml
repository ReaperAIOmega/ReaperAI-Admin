name: ReaperAI Admin Verify
on:
  push:
    branches: [main]
  # All PRs, including stacked PRs whose base is not main, plus manual runs on any branch.
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify static application
        run: node scripts/verify-static.mjs
      - name: Run every Admin test file (catch-all so new tests cannot silently skip CI)
        run: node --test scripts/*.test.mjs scripts/*.test.cjs
      - name: Check letter UI JavaScript syntax
        run: node --check letter-desk.js
      - name: Check OMEGA governance module syntax
        run: node --check omega-letter-governance.mjs

