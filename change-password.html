<!DOCTYPE html>
<html lang="en" style="visibility:hidden;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Johnson Strategic Solutions | Set Administrator Password</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="form-card" style="max-width: 500px; margin: 120px auto 0;">
    <h2 class="center">Replace Temporary Password</h2>
    <p class="center">Your temporary administrator credential must be replaced before the dashboard is available.</p>

    <form id="password-form">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="14" required>
      <p style="font-size:0.9rem; opacity:0.8;">Use at least 14 characters with uppercase, lowercase, a number, and a symbol.</p>

      <label for="confirm-password" style="display:block; margin-top:16px;">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="14" required>

      <button id="password-submit" type="submit" class="button" style="width:100%; margin-top:20px;">Set new password</button>
      <p id="password-status" class="status-message" role="status" aria-live="polite" style="margin-top:16px;"></p>
    </form>
  </div>

  <div class="footer">© Johnson Strategic Solutions | Restricted Administration</div>
  <script type="module" src="auth-guard.js"></script>
  <script type="module" src="change-password.js"></script>
</body>
</html>
