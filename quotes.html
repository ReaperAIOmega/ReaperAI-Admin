<!DOCTYPE html>
<html lang="en" style="visibility:hidden;">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Johnson Strategic Solutions | Quotes</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <div id="navbar" data-navbar="navbar-admin.html"></div>
  <div class="container">
    <div class="hero"><div class="hero-box"><h1>Client Quotes</h1><p>Create individualized scope and pricing. Sent quotes are immutable from the client side; replacements should supersede the prior quote.</p></div></div>
    <div class="form-card" style="margin-top:0;max-width:100%;">
      <h3>Create & send quote</h3>
      <form id="quote-form">
        <label for="quote-client">Client</label>
        <select id="quote-client" required><option value="">Select client</option></select>
        <label for="quote-case">Case / engagement</label>
        <select id="quote-case"><option value="">No case selected</option></select>
        <label for="quote-title">Quote title</label>
        <input id="quote-title" type="text" maxlength="160" placeholder="Example: Business Funding Strategy & Execution" required>
        <label for="quote-scope">Scope</label>
        <textarea id="quote-scope" maxlength="8000" placeholder="Describe exactly what is included for this client." required></textarea>
        <label for="quote-amount">Amount (USD)</label>
        <input id="quote-amount" type="number" min="1" step="0.01" inputmode="decimal" required>
        <label for="quote-expiry">Quote validity</label>
        <select id="quote-expiry"><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option><option value="0">No expiration</option></select>
        <button id="quote-submit" class="button" type="submit">Create & send quote</button>
        <p id="quote-status" class="status-message" role="status" aria-live="polite"></p>
      </form>
    </div>
    <div class="table-wrap"><h3>Issued quotes</h3><div id="quote-list">Loading quotes…</div></div>
  </div>
  <div class="footer">© Johnson Strategic Solutions | Admin Platform</div>
  <script type="module" src="auth-guard.js"></script><script src="load-navbar.js"></script><script type="module" src="quotes-admin.js"></script>
</body></html>
