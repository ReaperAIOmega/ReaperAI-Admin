<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Johnson Strategic Solutions | Administrator Sign In</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="form-card" style="max-width: 460px; margin: 120px auto 0;">
    <h2 class="center">Administrator Sign In</h2>
    <p class="center">Authorized Johnson Strategic Solutions administrators only.</p>

    <form id="admin-login-form">
      <label for="admin-email">Email</label>
      <input id="admin-email" type="email" name="email" autocomplete="username" required>

      <label for="admin-password" style="display:block; margin-top:16px;">Password</label>
      <input id="admin-password" type="password" name="password" autocomplete="current-password" required>

      <button id="admin-login-submit" type="submit" class="button" style="width:100%; margin-top:20px;">Sign in securely</button>
      <p id="admin-login-status" class="status-message" role="status" aria-live="polite" style="margin-top:16px;"></p>
    </form>

    <div class="center" style="margin-top:18px;">
      <a href="https://reaperai.com/" style="color:#7fb8ff; text-decoration:none;">Return to Johnson Strategic Solutions</a>
    </div>
  </div>

  <div class="footer">© Johnson Strategic Solutions | Restricted Administration</div>
  <script type="module" src="auth-login.js"></script>
</body>
</html>
