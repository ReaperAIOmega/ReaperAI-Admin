<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Johnson Strategic Solutions | Initialize Administrator Password</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="form-card" style="max-width: 460px; margin-top: 100px;">
    <h2 class="center">Initialize Administrator Password</h2>
    <p class="center">Set the permanent password for the authorized ReaperAI administrator account. This one-time link expires automatically.</p>

    <form id="initialize-password-form">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" required minlength="14">

      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" required minlength="14">

      <p style="font-size:0.92rem; opacity:.8;">Use at least 14 characters with uppercase, lowercase, a number, and a symbol.</p>

      <button id="initialize-password-submit" type="submit" class="button" style="width: 100%;">Set permanent password</button>
      <p id="initialize-password-status" class="status-message" role="status" aria-live="polite" style="margin-top:16px;"></p>
    </form>
  </div>

  <div class="footer">© Johnson Strategic Solutions | Restricted Administration</div>
  <script type="module" src="initialize-password.js"></script>
</body>
</html>
