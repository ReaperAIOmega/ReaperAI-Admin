<!DOCTYPE html>
<html lang="en" style="visibility:hidden;">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Johnson Strategic Solutions | Verify Admin Access</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <div class="form-card" style="max-width:460px;margin-top:110px;">
    <h2 class="center">Verify Administrator Access</h2>
    <p class="center">Enter the current six-digit code from your authenticator app.</p>
    <form id="mfa-challenge-form">
      <label for="mfa-code">Authenticator code</label>
      <input id="mfa-code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required autofocus>
      <button id="mfa-challenge-submit" type="submit" class="button" style="width:100%;">Verify</button>
      <p id="mfa-challenge-status" class="status-message" role="status" aria-live="polite"></p>
    </form>
    <div class="center" style="margin-top:16px;"><a href="#" data-signout style="color:#7fb8ff;text-decoration:none;">Sign out</a></div>
  </div>
  <div class="footer">© Johnson Strategic Solutions | Admin Security</div>
  <script type="module" src="auth-guard.js"></script><script type="module" src="mfa-challenge.js"></script>
</body></html>
